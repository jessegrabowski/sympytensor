name: run_tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            test-subset: tests --benchmark-skip
          - os: windows-latest
            python-version: "3.12"
            test-subset: tests --benchmark-skip

    runs-on: ${{ matrix.os }}

    defaults:
        run:
          shell: bash -leo pipefail {0}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476  # v3.0.0
      with:
        environment-file: .github/conda_envs/sympytensor.yml
        create-args: >-
          python=${{matrix.python-version}}
        micromamba-version: "latest"
        environment-name: sympytensor-test
        init-shell: bash
        cache-environment: true

    - name: Install current branch
      run: |
        pip install -e .
        python --version

    - name: Run tests
      run: |
        python -m pytest -vv --cov=sympytensor --cov-report=xml --no-cov-on-fail --cov-report term ${{ matrix.test-subset }}
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe  # v5.5.4
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # use token for more robust uploads
        name: ${{ matrix.os }}
        fail_ci_if_error: false
        verbose: true
