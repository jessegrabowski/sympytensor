[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = 'sympytensor'
dynamic = ['version']
requires-python = ">=3.12"
description = "Print sympy expressions to pytensor graphs"
readme = "README.md"
license = {text = "MIT License"}
classifiers =[
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics"
]

keywords = [
    "computer algebra",
    "pytensor",
    "sympy",
]

dependencies = [
    "pytensor>=3.0.0,<4.0.0",
    "sympy>=1.14.0",
    "pymc>=6.0.0,<7.0.0",
  ]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff==0.17.0",
]

[tool.hatch.version]
source = 'vcs'

[tool.hatch.build.hooks.vcs]
version-file = "sympytensor/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
  '.github',
]

[tool.hatch.build.targets.wheel]
packages = ["sympytensor"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
xfail_strict=true
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["sympytensor/_version.py", "setup.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C901", "ARG", "SIM", "UP", "RET"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Every ``_print_*`` handler must accept the printer's dispatch signature, so the
# ones that need no keyword arguments still declare ``**kwargs``.
"sympytensor/pytensor.py" = ["ARG002"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
pytensor = ">=3.0.0,<4.0.0"
sympy = ">=1.14.0"
pymc = ">=6.0.0,<7.0.0"
# conda-forge sympy does not carry the mpmath<1.4 cap from its PyPI metadata.
mpmath = ">=1.1.0,<1.4.0"

[tool.pixi.pypi-dependencies]
sympytensor = { path = ".", editable = true }

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = { features = ["dev", "py312"] }
py313 = { features = ["dev", "py313"] }
py314 = { features = ["dev", "py314"] }

[tool.pixi.tasks]
test = "pytest"
test-cov = "pytest -vv --cov=sympytensor --cov-report xml:coverage.xml --cov-report term"
lint = "pre-commit run --all-files"
fmt = "ruff format ."
